[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clr-sentry-mcp"
version = "0.1.0"
description = "MCP server for Sentry performance insights, monitors, and alerts"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "clearminds"}]
keywords = ["mcp", "sentry", "monitoring", "alerts", "performance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=2.14.0,<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Repository = "https://github.com/clearminds/clr-sentry-mcp"

[project.scripts]
clr-sentry-mcp = "clr_sentry_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clr_sentry_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
